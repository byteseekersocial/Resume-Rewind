
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Resume Rewind</title>
</head>
<body>
    <div id="ResumeRewindConfigPage"
         data-role="page"
         class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-checkbox">

        <div data-role="content">
            <div class="content-primary">

                <h2>Resume Rewind</h2>
                <p>
                    Configure the default rewind behavior for users
                    on this Jellyfin server.
                </p>

                <form id="ResumeRewindConfigForm">

                    <h3>TV Episodes</h3>

                    <div class="checkboxContainer">
                        <label class="emby-checkbox-label">
                            <input id="EpisodesEnabled"
                                   type="checkbox"
                                   is="emby-checkbox">
                            <span>Enable episode rewind by default</span>
                        </label>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="EpisodeRewindSeconds">
                            Default episode rewind (seconds)
                        </label>
                        <input id="EpisodeRewindSeconds"
                               type="number"
                               is="emby-input"
                               min="0"
                               max="60"
                               step="1">
                        <div class="fieldDescription">
                            Choose a value between 0 and 60 seconds.
                        </div>
                    </div>

                    <br>

                    <h3>Movies</h3>

                    <div class="checkboxContainer">
                        <label class="emby-checkbox-label">
                            <input id="MoviesEnabled"
                                   type="checkbox"
                                   is="emby-checkbox">
                            <span>Enable movie rewind by default</span>
                        </label>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="MovieRewindSeconds">
                            Default movie rewind (seconds)
                        </label>
                        <input id="MovieRewindSeconds"
                               type="number"
                               is="emby-input"
                               min="0"
                               max="60"
                               step="1">
                        <div class="fieldDescription">
                            Choose a value between 0 and 60 seconds.
                        </div>
                    </div>

                    <br>

                    <button is="emby-button"
                            type="submit"
                            class="raised button-submit block">
                        <span>Save</span>
                    </button>

                </form>
            </div>
        </div>

        <script>
            const ResumeRewindConfig = {
                pluginUniqueId: '95d6f48a-397e-4206-b97a-8474a864c7fe'
            };

            const configPage =
                document.querySelector('#ResumeRewindConfigPage');

            configPage.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();

                ApiClient.getPluginConfiguration(
                    ResumeRewindConfig.pluginUniqueId
                ).then(function (config) {
                    document.querySelector('#EpisodesEnabled').checked =
                        config.EpisodesEnabled;

                    document.querySelector('#EpisodeRewindSeconds').value =
                        config.EpisodeRewindSeconds;

                    document.querySelector('#MoviesEnabled').checked =
                        config.MoviesEnabled;

                    document.querySelector('#MovieRewindSeconds').value =
                        config.MovieRewindSeconds;

                    Dashboard.hideLoadingMsg();
                }).catch(function (error) {
                    console.error('Resume Rewind configuration error:', error);
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('#ResumeRewindConfigForm')
                .addEventListener('submit', function (event) {
                    event.preventDefault();
                    Dashboard.showLoadingMsg();

                    ApiClient.getPluginConfiguration(
                        ResumeRewindConfig.pluginUniqueId
                    ).then(function (config) {
                        config.EpisodesEnabled =
                            document.querySelector('#EpisodesEnabled').checked;

                        config.EpisodeRewindSeconds = Number(
                            document.querySelector('#EpisodeRewindSeconds').value
                        );

                        config.MoviesEnabled =
                            document.querySelector('#MoviesEnabled').checked;

                        config.MovieRewindSeconds = Number(
                            document.querySelector('#MovieRewindSeconds').value
                        );

                        if (
                            !Number.isInteger(config.EpisodeRewindSeconds) ||
                            !Number.isInteger(config.MovieRewindSeconds) ||
                            config.EpisodeRewindSeconds < 0 ||
                            config.EpisodeRewindSeconds > 60 ||
                            config.MovieRewindSeconds < 0 ||
                            config.MovieRewindSeconds > 60
                        ) {
                            throw new Error(
                                'Rewind durations must be whole numbers between 0 and 60.'
                            );
                        }

                        return ApiClient.updatePluginConfiguration(
                            ResumeRewindConfig.pluginUniqueId,
                            config
                        );
                    }).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    }).catch(function (error) {
                        console.error('Resume Rewind save error:', error);
                        Dashboard.hideLoadingMsg();
                        alert(error.message || 'Unable to save configuration.');
                    });
                });
        </script>
    </div>
</body>
</html>
