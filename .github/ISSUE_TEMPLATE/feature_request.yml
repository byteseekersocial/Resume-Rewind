name: Feature Request
description: Suggest an idea or improvement for Resume Rewind.
title: "[Feature Request]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Resume Rewind!
        Please provide as much detail as possible so the idea can be considered.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or limitation you're experiencing.
      placeholder: "I'm frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you'd like
      description: Explain what you would like Resume Rewind to do.
      placeholder: "I would like Resume Rewind to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Describe any alternatives you've tried.
    validations:
      required: false

  - type: dropdown
    id: feature_area
    attributes:
      label: Which area does this request relate to?
      description: Select the area most relevant to your suggestion.
      options:
        - Playback / Rewind Behavior
        - User Preferences
        - Administrator Configuration
        - Jellyfin Client Compatibility
        - User Interface
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add screenshots, examples, or anything else that might help explain your request.
      placeholder: Additional information...
    validations:
      required: false
